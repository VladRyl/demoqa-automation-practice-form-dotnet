name: UI tests and Allure report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allure-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_ui_tests:
    name: "🧪 Run Playwright POM Tests & Generate Allure"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Confirm runner started
        run: |
          echo "GitHub Actions runner is executing the workflow."
          echo "Runner OS: $RUNNER_OS"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build UI test container
        run: docker compose build ui-tests

      - name: Run tests with Docker Compose
        id: run_tests
        run: |
          mkdir -p allure-results
          docker compose run --rm ui-tests

      - name: Set up Node.js for Allure CLI
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Allure CLI
        if: always()
        run: npm install --global allure

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && find allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            allure generate allure-results --output allure-report
          else
            echo "No Allure result files were generated."
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        if: always() && github.event_name != 'pull_request' && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Generate Job Summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          echo "## 📊 Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment:** `ubuntu-latest` (Docker, Playwright .NET, Chromium)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger Event:** `${{ github.event_name }}` on ref `${{ github.ref_name }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Author:** @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TEST_OUTCOME" = "success" ]; then
            echo "- **Execution Status:** ✅ **Passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Execution Status:** ❌ **Failed** (`$TEST_OUTCOME`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🔗 Reporting" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- **Allure report:** Available as the `allure-report` artifact after this run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Allure report:** [Open GitHub Pages](${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }})" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy_report:
    name: "🚀 Publish Allure report to GitHub Pages"
    if: always() && github.event_name != 'pull_request' && needs.run_ui_tests.result != 'cancelled'
    needs: run_ui_tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
