name: UI tests and Allure report

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_ui_tests:
    name: "🧪 Run Playwright POM Tests & Generate Allure"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Confirm runner started
        run: |
          echo "GitHub Actions runner is executing the workflow."
          echo "Runner OS: $RUNNER_OS"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build UI test container
        run: docker compose build ui-tests

      - name: Run tests with Docker Compose
        run: |
          mkdir -p allure-results
          docker compose run --rm ui-tests

      - name: Set up Node.js for Allure CLI
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Allure CLI
        if: always()
        run: npm install --global allure

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && find allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            allure generate allure-results --output allure-report
          else
            echo "No Allure result files were generated."
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14
